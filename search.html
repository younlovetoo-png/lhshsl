<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상동행복작은도서관 도서 검색</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; color: #333; line-height: 1.6; }
        .notice { color: #d9534f; font-size: 0.9em; margin-bottom: 10px; font-weight: bold; }
        h1 { font-size: 1.6em; color: #2c3e50; border-left: 5px solid #27ae60; padding-left: 10px; margin-bottom: 25px; }
        
        .status-area { margin-bottom: 15px; }
        .loading { color: #27ae60; font-weight: bold; }
        .error { color: #d9534f; font-weight: bold; font-size: 0.9em; background: #fdf2f2; padding: 10px; border-radius: 5px; border: 1px solid #f5c6cb; }
        
        .search-bar { margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
        select, input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; }
        input[type="text"] { flex-grow: 1; max-width: 400px; }

        table { width: 100%; border-collapse: collapse; border-top: 2px solid #27ae60; margin-top: 10px; }
        th { background-color: #f8f9fa; border-bottom: 1px solid #ddd; padding: 12px; text-align: left; }
        td { border-bottom: 1px solid #eee; padding: 12px; font-size: 0.95em; }
        tr:hover { background-color: #f9fdfa; }
        .no-result { text-align: center; padding: 50px; color: #999; }
    </style>
</head>
<body>

    <p class="notice">※ 대출 여부는 실시간 반영되지 않으므로 도서관에 문의해주세요.</p>
    <h1>📖 상동행복작은도서관 도서 검색</h1>

    <div id="statusArea" class="status-area">
        <div id="loadingStatus" class="loading">⏳ 도서 목록을 실시간으로 불러오는 중입니다...</div>
    </div>

    <div class="search-bar">
        <select id="searchType">
            <option value="all">전체</option>
            <option value="서명">서명</option>
            <option value="저자">저자</option>
            <option value="출판사">출판사</option>
        </select>
        <input type="text" id="searchInput" placeholder="찾으시는 도서명이나 저자를 입력하세요" onkeyup="filterBooks()">
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 45%;">서명</th>
                <th style="width: 25%;">저자</th>
                <th style="width: 30%;">출판사</th>
            </tr>
        </thead>
        <tbody id="bookTableBody">
            </tbody>
    </table>

    <script>
        // 요청하신 상세 주소 적용
        const SHEETS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQl3SnVcB_YTLmDvdDostT9OEBt2oBo0i4pKT6UxNI0iB2ItCKEtFBeAU4Dzl9uZ23ddj_kdsC7IFo0/pub?gid=0&single=true&output=csv';

        let bookData = [];

        function loadData() {
            // 캐시 방지를 위해 랜덤 파라미터 추가
            const finalUrl = SHEETS_CSV_URL + '&t=' + new Date().getTime();

            Papa.parse(finalUrl, {
                download: true,
                header: true,
                skipEmptyLines: 'greedy',
                complete: function(results) {
                    console.log("불러온 데이터:", results.data);
                    bookData = results.data;
                    renderBooks(bookData);
                    document.getElementById('loadingStatus').style.display = 'none';
                },
                error: function(err) {
                    console.error("에러 발생:", err);
                    document.getElementById('statusArea').innerHTML = `
                        <div class="error">
                            ❌ 데이터를 불러오지 못했습니다.<br>
                            개인 PC에서 파일을 직접 열면 보안상 차단될 수 있습니다.<br>
                            설정: <b>파일 > 공유 > 웹에 게시 > CSV 형식</b>으로 게시되었는지 확인해 주세요.
                        </div>`;
                }
            });
        }

        function renderBooks(data) {
            const tbody = document.getElementById('bookTableBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="no-result">도서 목록이 비어 있습니다.</td></tr>';
                return;
            }

            data.forEach(book => {
                // 시트의 컬럼명(첫 줄)이 '서명', '저자', '출판사'여야 합니다.
                const title = book['서명'] || Object.values(book)[0] || '-';
                const author = book['저자'] || Object.values(book)[1] || '-';
                const publisher = book['출판사'] || Object.values(book)[2] || '-';

                const row = `<tr>
                    <td>${title}</td>
                    <td>${author}</td>
                    <td>${publisher}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function filterBooks() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('searchType').value;
            
            const filtered = bookData.filter(book => {
                const title = String(book['서명'] || Object.values(book)[0] || '').toLowerCase();
                const author = String(book['저자'] || Object.values(book)[1] || '').toLowerCase();
                const publisher = String(book['출판사'] || Object.values(book)[2] || '').toLowerCase();

                if (type === 'all') {
                    return title.includes(input) || author.includes(input) || publisher.includes(input);
                } else if (type === '서명') return title.includes(input);
                else if (type === '저자') return author.includes(input);
                else if (type === '출판사') return publisher.includes(input);
            });
            
            renderBooks(filtered);
        }

        loadData();
    </script>
</body>
</html>
