<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상동행복작은도서관 도서 검색</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; color: #333; line-height: 1.6; }
        .notice { color: #d9534f; font-size: 0.9em; margin-bottom: 10px; font-weight: bold; }
        h1 { font-size: 1.6em; color: #2c3e50; border-left: 5px solid #27ae60; padding-left: 10px; margin-bottom: 25px; }
        
        .status-area { margin-bottom: 15px; }
        .loading { color: #27ae60; font-weight: bold; }
        .error { color: #d9534f; font-weight: bold; font-size: 0.9em; background: #fdf2f2; padding: 10px; border-radius: 5px; border: 1px solid #f5c6cb; }
        
        .search-bar { margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
        select, input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; }
        input[type="text"] { flex-grow: 1; max-width: 400px; }

        table { width: 100%; border-collapse: collapse; border-top: 2px solid #27ae60; margin-top: 10px; }
        th { background-color: #f8f9fa; border-bottom: 1px solid #ddd; padding: 12px; text-align: left; }
        td { border-bottom: 1px solid #eee; padding: 12px; font-size: 0.95em; }
        tr:hover { background-color: #f9fdfa; }
        .no-result { text-align: center; padding: 50px; color: #999; }

        /* 이미지 스타일의 페이지네이션 디자인 */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 30px; margin-bottom: 50px; }
        .pagination button { width: 36px; height: 36px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9em; color: #666; transition: 0.2s; }
        .pagination button.active { background: #666; color: white; border-color: #666; font-weight: bold; }
        .pagination button:hover:not(.active):not(:disabled) { border-color: #999; color: #333; }
        .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
        .pagination .dots { color: #999; margin: 0 5px; }
        .page-info { margin-top: 10px; text-align: center; font-size: 0.85em; color: #888; }
    </style>
</head>
<body>

    <p class="notice">※ 대출 여부는 실시간 반영되지 않으므로 도서관에 문의해주세요.</p>
    <h1>📖 상동행복작은도서관 도서 검색</h1>

    <div id="statusArea" class="status-area">
        <div id="loadingStatus" class="loading">⏳ 도서 목록을 실시간으로 불러오는 중입니다...</div>
    </div>

    <div class="search-bar">
        <select id="searchType">
            <option value="all">전체</option>
            <option value="서명">서명</option>
            <option value="저자">저자</option>
            <option value="출판사">출판사</option>
        </select>
        <input type="text" id="searchInput" placeholder="찾으시는 도서명이나 저자를 입력하세요" onkeyup="handleSearch()">
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 45%;">서명</th>
                <th style="width: 25%;">저자</th>
                <th style="width: 30%;">출판사</th>
            </tr>
        </thead>
        <tbody id="bookTableBody"></tbody>
    </table>

    <div id="pagination" class="pagination"></div>
    <div id="pageInfo" class="page-info"></div>

    <script>
        const SHEETS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQl3SnVcB_YTLmDvdDostT9OEBt2oBo0i4pKT6UxNI0iB2ItCKEtFBeAU4Dzl9uZ23ddj_kdsC7IFo0/pub?gid=0&single=true&output=csv';

        let bookData = []; 
        let filteredData = []; 
        let currentPage = 1;
        const rowsPerPage = 20; 
        const showPageCount = 5; // 현재 페이지 앞뒤로 보여줄 최대 번호 개수

        function loadData() {
            const finalUrl = SHEETS_CSV_URL + '&t=' + new Date().getTime();
            Papa.parse(finalUrl, {
                download: true, header: true, skipEmptyLines: 'greedy',
                complete: function(results) {
                    bookData = results.data;
                    filteredData = [...bookData];
                    displayPage(1);
                    document.getElementById('loadingStatus').style.display = 'none';
                },
                error: function() {
                    document.getElementById('statusArea').innerHTML = `<div class="error">❌ 데이터를 불러오지 못했습니다.</div>`;
                }
            });
        }

        function displayPage(page) {
            currentPage = page;
            const tbody = document.getElementById('bookTableBody');
            tbody.innerHTML = '';

            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = filteredData.slice(start, end);

            if (paginatedItems.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="no-result">결과가 없습니다.</td></tr>';
                document.getElementById('pagination').innerHTML = '';
                document.getElementById('pageInfo').innerText = '';
                return;
            }

            paginatedItems.forEach(book => {
                const title = book['서명'] || Object.values(book)[0] || '-';
                const author = book['저자'] || Object.values(book)[1] || '-';
                const publisher = book['출판사'] || Object.values(book)[2] || '-';
                tbody.innerHTML += `<tr><td>${title}</td><td>${author}</td><td>${publisher}</td></tr>`;
            });

            renderPagination(filteredData.length);
        }

        function createPageBtn(text, page, isActive = false, isDisabled = false) {
            const btn = document.createElement('button');
            btn.innerHTML = text;
            if (isActive) btn.classList.add('active');
            btn.disabled = isDisabled;
            btn.onclick = () => {
                displayPage(page);
                window.scrollTo(0, 0);
            };
            return btn;
        }

        function renderPagination(totalItems) {
            const paginationEl = document.getElementById('pagination');
            const pageInfoEl = document.getElementById('pageInfo');
            paginationEl.innerHTML = '';

            const totalPages = Math.ceil(totalItems / rowsPerPage);
            if (totalPages <= 1) {
                pageInfoEl.innerText = `총 ${totalItems}권`;
                return;
            }

            // 이전 버튼
            paginationEl.appendChild(createPageBtn('&lt;', Math.max(currentPage - 1, 1), false, currentPage === 1));

            // 페이지 로직: 현재 페이지 기준으로 앞뒤 showPageCount 범위만 노출
            let start = Math.max(currentPage - Math.floor(showPageCount / 2), 1);
            let end = Math.min(start + showPageCount - 1, totalPages);
            
            if (end - start + 1 < showPageCount) {
                start = Math.max(end - showPageCount + 1, 1);
            }

            // 첫 페이지가 범위 밖이면 '1'과 '...' 표시
            if (start > 1) {
                paginationEl.appendChild(createPageBtn('1', 1));
                if (start > 2) {
                    const dots = document.createElement('span');
                    dots.className = 'dots';
                    dots.innerText = '...';
                    paginationEl.appendChild(dots);
                }
            }

            // 숫자 버튼
            for (let i = start; i <= end; i++) {
                paginationEl.appendChild(createPageBtn(i, i, i === currentPage));
            }

            // 마지막 페이지가 범위 밖이면 '...'과 '마지막번호' 표시
            if (end < totalPages) {
                if (end < totalPages - 1) {
                    const dots = document.createElement('span');
                    dots.className = 'dots';
                    dots.innerText = '...';
                    paginationEl.appendChild(dots);
                }
                paginationEl.appendChild(createPageBtn(totalPages, totalPages));
            }

            // 다음 버튼
            paginationEl.appendChild(createPageBtn('&gt;', Math.min(currentPage + 1, totalPages), false, currentPage === totalPages));

            pageInfoEl.innerText = `총 ${totalItems}권 | ${currentPage} / ${totalPages} 페이지`;
        }

        function handleSearch() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('searchType').value;
            filteredData = bookData.filter(book => {
                const title = String(book['서명'] || Object.values(book)[0] || '').toLowerCase();
                const author = String(book['저자'] || Object.values(book)[1] || '').toLowerCase();
                const publisher = String(book['출판사'] || Object.values(book)[2] || '').toLowerCase();
                if (type === 'all') return title.includes(input) || author.includes(input) || publisher.includes(input);
                else if (type === '서명') return title.includes(input);
                else if (type === '저자') return author.includes(input);
                else if (type === '출판사') return publisher.includes(input);
            });
            displayPage(1); 
        }
        loadData();
    </script>
</body>
</html>
